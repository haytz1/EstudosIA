<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Exploração interativa do Sistema Solar - descubra dados detalhados, simulações orbitais e comparações entre os planetas.">
    <title>Cosmos - Exploração Interativa do Sistema Solar</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #030712;
            --card-bg: rgba(15, 23, 42, 0.65);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-hover-border: rgba(56, 189, 248, 0.5);
            --accent-cyan: #38bdf8;
            --accent-purple: #a855f7;
            --accent-gold: #fbbf24;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --font-title: 'Orbitron', sans-serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-body);
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Canvas de Fundo (Estrelas e Meteoros) */
        #spaceCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        /* Header e Navbar */
        header {
            padding: 3rem 2rem 1.5rem;
            text-align: center;
            position: relative;
            background: radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.15), transparent 70%);
        }

        .logo-tag {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: var(--accent-cyan);
            padding: 0.4rem 1.2rem;
            border-radius: 50px;
            font-family: var(--font-title);
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
            backdrop-filter: blur(8px);
        }

        h1 {
            font-family: var(--font-title);
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 900;
            line-height: 1.1;
            background: linear-gradient(135deg, #ffffff 30%, var(--accent-cyan) 70%, var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 40px rgba(56, 189, 248, 0.3);
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
            max-width: 680px;
            margin: 0 auto 2.5rem;
            line-height: 1.6;
            font-weight: 400;
        }

        /* Controles Principais (Navegação por Abas, Busca e Filtros) */
        .controls-container {
            max-width: 1200px;
            margin: 0 auto 2.5rem;
            padding: 0 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            align-items: center;
        }

        /* Abas Principais */
        .nav-tabs {
            display: flex;
            background: rgba(15, 23, 42, 0.8);
            padding: 0.4rem;
            border-radius: 50px;
            border: 1px solid var(--card-border);
            backdrop-filter: blur(12px);
            gap: 0.3rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 0.7rem 1.6rem;
            border-radius: 40px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .tab-btn:hover {
            color: var(--text-primary);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(168, 85, 247, 0.2));
            color: #ffffff;
            border: 1px solid rgba(56, 189, 248, 0.4);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        }

        /* Barra de Busca e Filtros */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .search-box {
            position: relative;
            min-width: 280px;
            max-width: 400px;
            width: 100%;
        }

        .search-box input {
            width: 100%;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--card-border);
            border-radius: 30px;
            padding: 0.75rem 1.2rem 0.75rem 2.8rem;
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.25);
        }

        .search-box svg {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            fill: var(--text-secondary);
        }

        .filter-chips {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .chip {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--card-border);
            color: var(--text-secondary);
            padding: 0.5rem 1.1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .chip:hover, .chip.active {
            background: rgba(56, 189, 248, 0.15);
            border-color: var(--accent-cyan);
            color: var(--text-primary);
        }

        /* Áreas de Conteúdo (Abas) */
        .content-section {
            display: none;
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 1.5rem 4rem;
        }

        .content-section.active {
            display: block;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* GRID DE PLANETAS (Aba 1) */
        .planets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }

        .planet-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 2.2rem 1.8rem 1.8rem;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(16px);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .planet-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.08), transparent 70%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .planet-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: var(--card-hover-border);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(56, 189, 248, 0.15);
        }

        .planet-card:hover::before {
            opacity: 1;
        }

        .type-badge {
            position: absolute;
            top: 1.2rem;
            right: 1.2rem;
            font-size: 0.7rem;
            font-family: var(--font-title);
            padding: 0.3rem 0.7rem;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Renderização CSS 3D dos Planetas */
        .planet-visual-container {
            width: 160px;
            height: 160px;
            margin: 1rem auto 1.8rem;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 800px;
        }

        .planet-sphere {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            position: relative;
            box-shadow: inset -25px -25px 40px rgba(0, 0, 0, 0.9), 
                        0 0 25px rgba(255, 255, 255, 0.15);
            transition: transform 0.6s ease;
            background-size: cover;
        }

        .planet-card:hover .planet-sphere {
            transform: rotate(15deg) scale(1.08);
        }

        /* Estilos e Texturas dos Planetas */
        .mercurio {
            background: radial-gradient(circle at 35% 35%, #b5b5b5, #707070 40%, #2b2b2b);
            box-shadow: inset -25px -25px 40px rgba(0,0,0,0.9), 0 0 20px rgba(181, 181, 181, 0.3);
        }
        .venus {
            background: radial-gradient(circle at 35% 35%, #ffd699, #e6994d 50%, #804d1a);
            box-shadow: inset -25px -25px 40px rgba(0,0,0,0.9), 0 0 25px rgba(230, 153, 77, 0.4);
        }
        .terra {
            background: radial-gradient(circle at 35% 35%, #64b5f6, #1e88e5 35%, #1565c0 60%, #0d47a1);
            box-shadow: inset -25px -25px 40px rgba(0,0,0,0.9), 0 0 30px rgba(30, 136, 229, 0.5);
        }
        .marte {
            background: radial-gradient(circle at 35% 35%, #ff8a65, #e64a19 50%, #880e4f);
            box-shadow: inset -25px -25px 40px rgba(0,0,0,0.9), 0 0 25px rgba(230, 74, 25, 0.4);
        }
        .jupiter {
            background: repeating-linear-gradient(
                180deg,
                #d7ccc8 0px,
                #a1887f 12px,
                #8d6e63 24px,
                #d7ccc8 36px,
                #bcaaa4 48px
            );
            box-shadow: inset -25px -25px 40px rgba(0,0,0,0.9), 0 0 30px rgba(141, 110, 99, 0.4);
        }
        .saturno-sphere {
            background: repeating-linear-gradient(
                180deg,
                #ffe0b2 0px,
                #ffcc80 15px,
                #bcaaa4 30px,
                #ffe0b2 45px
            );
        }
        /* Anéis de Saturno */
        .saturno-rings {
            position: absolute;
            width: 210px;
            height: 65px;
            border-radius: 50%;
            border: 14px solid rgba(222, 184, 135, 0.7);
            border-top-color: rgba(222, 184, 135, 0.2);
            transform: rotateX(75deg) rotateY(-15deg);
            box-shadow: 0 0 15px rgba(222, 184, 135, 0.3);
            pointer-events: none;
        }
        .urano-sphere {
            background: radial-gradient(circle at 35% 35%, #80deea, #26c6da 50%, #00838f);
            box-shadow: inset -25px -25px 40px rgba(0,0,0,0.9), 0 0 30px rgba(38, 198, 218, 0.4);
        }
        .urano-rings {
            position: absolute;
            width: 170px;
            height: 170px;
            border-radius: 50%;
            border: 2px solid rgba(128, 222, 234, 0.4);
            transform: rotateX(80deg) rotateZ(85deg);
            pointer-events: none;
        }
        .netuno {
            background: radial-gradient(circle at 35% 35%, #42a5f5, #1976d2 50%, #0d47a1);
            box-shadow: inset -25px -25px 40px rgba(0,0,0,0.9), 0 0 30px rgba(25, 118, 210, 0.5);
        }
        .plutao {
            background: radial-gradient(circle at 35% 35%, #cfd8dc, #90a4ae 50%, #37474f);
            box-shadow: inset -25px -25px 40px rgba(0,0,0,0.9), 0 0 15px rgba(144, 164, 174, 0.3);
        }

        .planet-card h3 {
            font-family: var(--font-title);
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: #ffffff;
        }

        .planet-card p.desc {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 1.5rem;
            min-height: 2.7rem;
        }

        .quick-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem;
            padding-top: 1.2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(0, 0, 0, 0.2);
            margin: 0 -1.8rem -1.8rem;
            padding: 1.2rem 1.8rem;
            border-bottom-left-radius: 24px;
            border-bottom-right-radius: 24px;
        }

        .q-stat {
            text-align: left;
        }

        .q-stat .val {
            display: block;
            font-family: var(--font-title);
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--accent-cyan);
        }

        .q-stat .lbl {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        /* MODAL DE DETALHES */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(3, 7, 18, 0.85);
            backdrop-filter: blur(16px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--card-hover-border);
            border-radius: 28px;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 2.5rem;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .close-btn {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn:hover {
            background: rgba(239, 68, 68, 0.3);
            color: #ef4444;
        }

        .modal-header {
            display: flex;
            align-items: center;
            gap: 2rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .modal-header h2 {
            font-family: var(--font-title);
            font-size: 2.5rem;
            color: #fff;
        }

        .modal-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.2rem;
            margin-bottom: 2rem;
        }

        .modal-stat-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 1.2rem;
            border-radius: 16px;
        }

        .modal-stat-box .title {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.4rem;
        }

        .modal-stat-box .value {
            font-family: var(--font-title);
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--accent-cyan);
        }

        .modal-text {
            color: var(--text-secondary);
            line-height: 1.8;
            font-size: 1rem;
            margin-bottom: 1.5rem;
        }

        /* ABA SIMULADOR DE ÓRBITAS */
        .orbit-container {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            padding: 2rem;
            position: relative;
            min-height: 600px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .sun-center {
            width: 70px;
            height: 70px;
            background: radial-gradient(circle, #fff, #fbbf24 60%, #d97706);
            border-radius: 50%;
            box-shadow: 0 0 60px #fbbf24, 0 0 100px rgba(251, 191, 36, 0.5);
            position: absolute;
            z-index: 10;
        }

        .orbit-ring {
            position: absolute;
            border: 1px dashed rgba(255, 255, 255, 0.12);
            border-radius: 50%;
            animation: rotateOrbit linear infinite;
        }

        .orbit-planet-dot {
            position: absolute;
            top: 50%;
            left: 0;
            transform: translate(-50%, -50%);
            border-radius: 50%;
        }

        @keyframes rotateOrbit {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* ABA COMPARADOR DE PLANETAS */
        .comparator-container {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            padding: 2.5rem;
            backdrop-filter: blur(16px);
        }

        .comparator-selectors {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .selector-group label {
            display: block;
            font-family: var(--font-title);
            font-size: 0.9rem;
            color: var(--accent-cyan);
            margin-bottom: 0.8rem;
        }

        .selector-group select {
            width: 100%;
            background: rgba(3, 7, 18, 0.8);
            border: 1px solid var(--card-border);
            color: #fff;
            padding: 0.9rem 1.2rem;
            border-radius: 16px;
            font-size: 1rem;
            outline: none;
            cursor: pointer;
        }

        .comparison-display {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        .compare-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 2rem;
            text-align: center;
        }

        .compare-card h4 {
            font-family: var(--font-title);
            font-size: 1.6rem;
            margin-bottom: 1.5rem;
        }

        .compare-stat-row {
            display: flex;
            justify-content: space-between;
            padding: 0.8rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 0.95rem;
        }

        .compare-stat-row span:first-child {
            color: var(--text-secondary);
        }

        .compare-stat-row span:last-child {
            font-weight: 700;
            color: var(--accent-cyan);
        }

        /* Rodapé */
        footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
            font-size: 0.85rem;
            border-top: 1px solid var(--card-border);
            margin-top: 2rem;
        }

        /* Responsividade */
        @media (max-width: 768px) {
            header { padding: 2rem 1rem; }
            h1 { font-size: 2.2rem; }
            .comparator-selectors, .comparison-display { grid-template-columns: 1fr; }
            .nav-tabs { flex-direction: column; width: 100%; border-radius: 20px; }
            .tab-btn { justify-content: center; }
        }
    </style>
</head>
<body>

    <!-- Canvas de Fundo Animado -->
    <canvas id="spaceCanvas"></canvas>

    <!-- Cabeçalho -->
    <header>
        <div class="logo-tag">⚡ Cosmos 360</div>
        <h1>Sistema Explorador Avançado de planetas 2.0 pro player pvp youtube</h1>
        <p class="subtitle">Uma jornada interativa e imersiva através dos corpos celestes que orbitam nossa estrela mãe.</p>
    </header>

    <!-- Controles de Navegação -->
    <div class="controls-container">
        <!-- Abas -->
        <nav class="nav-tabs">
            <button class="tab-btn active" data-tab="tab-grid">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                Explorar Planetas
            </button>
            <button class="tab-btn" data-tab="tab-orbit">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
                Simulador de Órbitas
            </button>
            <button class="tab-btn" data-tab="tab-compare">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5"></path><path d="M8 21H3v-5"></path><path d="M21 3l-7 7"></path><path d="M3 21l7-7"></path></svg>
                Comparador
            </button>
        </nav>

        <!-- Filtros e Busca (Visível apenas na aba Grid) -->
        <div class="filter-bar" id="filterBar">
            <div class="search-box">
                <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <input type="text" id="searchInput" placeholder="Buscar planeta ou característica...">
            </div>
            <div class="filter-chips">
                <button class="chip active" data-filter="all">Todos</button>
                <button class="chip" data-filter="rochoso">Rochosos</button>
                <button class="chip" data-filter="gasoso">Gigantes Gasosos</button>
                <button class="chip" data-filter="gelo">Gigantes de Gelo</button>
                <button class="chip" data-filter="anao">Planetas Anões</button>
            </div>
        </div>
    </div>

    <!-- SEÇÃO 1: GRID DE PLANETAS -->
    <main id="tab-grid" class="content-section active">
        <div class="planets-grid" id="planetsGrid"></div>
    </main>

    <!-- SEÇÃO 2: SIMULADOR DE ÓRBITAS -->
    <section id="tab-orbit" class="content-section">
        <div class="orbit-container" id="orbitContainer">
            <div class="sun-center"></div>

    <!-- SEÇÃO 3: COMPARADOR DE PLANETAS -->

        <div class="comparator-container">

                <div class="selector-group">
                    <label for="selectPlanet2">Planeta 2</label>

    <!-- MODAL DE DETALHES -->

                    <span class="type-badge" id="modalType"></span>

            </div>
            <p class="modal-text" id="modalDesc"></p>
            <div class="modal-grid" id="modalGrid"></div>
            <div style="margin-top:1.5rem;">
                <h4 style="font-family: var(--font-title); margin-bottom: 0.8rem; color: var(--accent-cyan);">Curiosidade</h4>
                <p class="modal-text" id="modalCuriosity" style="margin-bottom:0; font-style: italic;"></p>
            </div>
        </div>
    </div>

    <footer>
        <p>© 2026 Cosmos 360 - Explorador do Sistema Solar em Arquivo Único HTML</p>
    </footer>

    <script>
        // DATA DOS PLANETAS
        const planetsData = [

                curiosity: 'Abriga o Olympus Mons, o maior vulcão do Sistema Solar, com quase três vezes a altura do Monte Everest.',

                curiosity: 'Saturno tem uma densidade tão baixa que boiaria na água se existisse um oceano grande o suficiente!',

                classVisual: 'saturno-sphere',

            },
            {
                id: 'urano',
                name: 'Urano',
                type: 'gelo',
                typeLabel: 'Gigante de Gelo',
                desc: 'Um planeta azul-esverdeado de gelo com um eixo de rotação inclinado a quase 98 graus.',
                curiosity: 'Devido à sua inclinação extrema, cada polo de Urano passa 42 anos sob luz solar contínua seguidos de 42 anos de escuridão.',
                diameter: '50.724 km',
                distance: '2.871 mi km',
                orbit: '84 anos',
                dayLength: '17,2 horas',
                moons: 28,
                temp: '-195°C (média)',
                classVisual: 'urano-sphere',
                hasUranoRings: true,
                orbitRadius: 380,
                orbitSpeed: 85
            },
            {
                id: 'netuno',
                name: 'Netuno',
                type: 'gelo',
                typeLabel: 'Gigante de Gelo',
                desc: 'O planeta mais distante do Sol, conhecido por seus ventos supersônicos que podem ultrapassar 2.000 km/h.',
                curiosity: 'Netuno foi o primeiro planeta localizado através de cálculos matemáticos antes de ser observado por telescópio.',
                diameter: '49.244 km',
                distance: '4.495 mi km',
                orbit: '164,8 anos',
                dayLength: '16,1 horas',
                moons: 16,
                temp: '-200°C (média)',
                classVisual: 'netuno',
                orbitRadius: 430,
                orbitSpeed: 110
            },
            {
                id: 'plutao',
                name: 'Plutão',
                type: 'anao',
                typeLabel: 'Planeta Anão',
                desc: 'Localizado no Cinturão de Kuiper, possui um coração de gelo de nitrogênio e cinco luas conhecidas.',
                curiosity: 'Plutão é menor que a Lua da Terra e menor até mesmo do que a área territorial dos Estados Unidos.',
                diameter: '2.376 km',
                distance: '5.906 mi km',
                orbit: '248 anos',
                dayLength: '6,4 dias',
                moons: 5,
                temp: '-230°C (média)',
                classVisual: 'plutao',
                orbitRadius: 470,
                orbitSpeed: 140
            }
        ];

        // REFERÊNCIAS DOM
        const gridContainer = document.getElementById('planetsGrid');
        const searchInput = document.getElementById('searchInput');
        const chips = document.querySelectorAll('.chip');
        const tabBtns = document.querySelectorAll('.tab-btn');
        const contentSections = document.querySelectorAll('.content-section');
        const filterBar = document.getElementById('filterBar');

        let currentFilter = 'all';
        let currentSearch = '';

        // RENDERIZAR GRID DE PLANETAS
        function renderPlanets() {
            gridContainer.innerHTML = '';
            
            const filtered = planetsData.filter(planet => {
                const matchesFilter = currentFilter === 'all' || planet.type === currentFilter;
                const matchesSearch = planet.name.toLowerCase().includes(currentSearch.toLowerCase()) || 
                                      planet.desc.toLowerCase().includes(currentSearch.toLowerCase());
                return matchesFilter && matchesSearch;
            });

            if(filtered.length === 0) {
                gridContainer.innerHTML = `
                    <div style="grid-column: 1/-1; text-align:center; padding: 4rem; color: var(--text-secondary);">
                        <h3>Nenhum planeta encontrado</h3>
                        <p style="margin-top:0.5rem;">Tente ajustar sua busca ou filtro.</p>
                    </div>
                `;
                return;
            }

            filtered.forEach(planet => {
                const card = document.createElement('article');
                card.className = 'planet-card';

                let visualHtml = `<div class="planet-sphere ${planet.classVisual}"></div>`;
                if (planet.hasRings) {
                    visualHtml += `<div class="saturno-rings"></div>`;
                }
                if (planet.hasUranoRings) {
                    visualHtml += `<div class="urano-rings"></div>`;
                }

                card.innerHTML = `
                    <span class="type-badge">${planet.typeLabel}</span>
                    <div class="planet-visual-container">
                        ${visualHtml}
                    </div>
                    <div>
                        <h3>${planet.name}</h3>
                        <p class="desc">${planet.desc}</p>
                    </div>
                    <div class="quick-stats">
                        <div class="q-stat">
                            <span class="val">${planet.moons}</span>
                            <span class="lbl">Luas</span>
                        </div>
                        <div class="q-stat">
                            <span class="val">${planet.orbit}</span>
                            <span class="lbl">Órbita</span>
                        </div>
                    </div>
                `;

                card.addEventListener('click', () => openModal(planet));
                gridContainer.appendChild(card);
            });
        }

        // CONTROLAR MODAL
        const modal = document.getElementById('planetModal');
        const closeModalBtn = document.getElementById('closeModal');

        function openModal(planet) {
            let visualHtml = `<div class="planet-sphere ${planet.classVisual}" style="width: 140px; height: 140px;"></div>`;
            if (planet.hasRings) {
                visualHtml += `<div class="saturno-rings" style="width: 230px; height: 75px;"></div>`;
            }
            if (planet.hasUranoRings) {
                visualHtml += `<div class="urano-rings" style="width: 190px; height: 190px;"></div>`;
            }

            document.getElementById('modalVisual').innerHTML = visualHtml;
            document.getElementById('modalName').textContent = planet.name;
            document.getElementById('modalType').textContent = planet.typeLabel;
            document.getElementById('modalDesc').textContent = planet.desc;
            document.getElementById('modalCuriosity').textContent = `"${planet.curiosity}"`;

            document.getElementById('modalGrid').innerHTML = `
                <div class="modal-stat-box"><div class="title">Diâmetro</div><div class="value">${planet.diameter}</div></div>
                <div class="modal-stat-box"><div class="title">Distância do Sol</div><div class="value">${planet.distance}</div></div>
                <div class="modal-stat-box"><div class="title">Período Orbital</div><div class="value">${planet.orbit}</div></div>
                <div class="modal-stat-box"><div class="title">Duração do Dia</div><div class="value">${planet.dayLength}</div></div>
                <div class="modal-stat-box"><div class="title">Número de Luas</div><div class="value">${planet.moons}</div></div>
                <div class="modal-stat-box"><div class="title">Temperatura Média</div><div class="value">${planet.temp}</div></div>
            `;

            modal.classList.add('active');
        }

        closeModalBtn.addEventListener('click', () => modal.classList.remove('active'));
        modal.addEventListener('click', (e) => {
            if (e.target === modal) modal.classList.remove('active');
        });

        // SIMULADOR DE ÓRBITAS
        function buildOrbits() {
            const container = document.getElementById('orbitContainer');
            // Limpa órbitas antigas
            const existingRings = container.querySelectorAll('.orbit-ring');
            existingRings.forEach(r => r.remove());

            planetsData.forEach(p => {
                const ring = document.createElement('div');
                ring.className = 'orbit-ring';
                const size = p.orbitRadius * 2;
                ring.style.width = `${size}px`;
                ring.style.height = `${size}px`;
                ring.style.animationDuration = `${p.orbitSpeed}s`;

                const dot = document.createElement('div');
                dot.className = `orbit-planet-dot ${p.classVisual}`;
                dot.style.width = '16px';
                dot.style.height = '16px';
                dot.title = p.name;

                ring.appendChild(dot);
                container.appendChild(ring);
            });
        }

        // COMPARADOR DE PLANETAS
        const select1 = document.getElementById('selectPlanet1');
        const select2 = document.getElementById('selectPlanet2');
        const compareDisplay = document.getElementById('comparisonDisplay');

        function setupComparator() {
            select1.innerHTML = '';
            select2.innerHTML = '';
            planetsData.forEach((p, index) => {
                select1.add(new Option(p.name, p.id, false, index === 2)); // Terra
                select2.add(new Option(p.name, p.id, false, index === 3)); // Marte
            });

            select1.addEventListener('change', updateComparison);
            select2.addEventListener('change', updateComparison);
            updateComparison();
        }

        function updateComparison() {
            const p1 = planetsData.find(p => p.id === select1.value);
            const p2 = planetsData.find(p => p.id === select2.value);

            function renderCompareCard(planet) {
                return `
                    <div class="compare-card">
                        <div class="planet-visual-container" style="height: 120px;">
                            <div class="planet-sphere ${planet.classVisual}" style="width: 90px; height: 90px;"></div>
                        </div>
                        <h4>${planet.name}</h4>
                        <div class="compare-stat-row"><span>Tipo</span><span>${planet.typeLabel}</span></div>
                        <div class="compare-stat-row"><span>Diâmetro</span><span>${planet.diameter}</span></div>
                        <div class="compare-stat-row"><span>Distância do Sol</span><span>${planet.distance}</span></div>
                        <div class="compare-stat-row"><span>Período Orbital</span><span>${planet.orbit}</span></div>
                        <div class="compare-stat-row"><span>Duração do Dia</span><span>${planet.dayLength}</span></div>
                        <div class="compare-stat-row"><span>Luas</span><span>${planet.moons}</span></div>
                        <div class="compare-stat-row"><span>Temperatura Média</span><span>${planet.temp}</span></div>
                    </div>
                `;
            }

            compareDisplay.innerHTML = renderCompareCard(p1) + renderCompareCard(p2);
        }

        // EVENTOS DE BUSCA E FILTROS
        searchInput.addEventListener('input', (e) => {
            currentSearch = e.target.value;
            renderPlanets();
        });

        chips.forEach(chip => {
            chip.addEventListener('click', () => {
                chips.forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                currentFilter = chip.dataset.filter;
                renderPlanets();
            });
        });

        // TROCA DE ABAS
        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                tabBtns.forEach(b => b.classList.remove('active'));
                contentSections.forEach(s => s.classList.remove('active'));

                btn.classList.add('active');
                const activeTabId = btn.dataset.tab;
                document.getElementById(activeTabId).classList.add('active');

                // Esconde a barra de busca se não estiver na aba de grid
                if (activeTabId === 'tab-grid') {
                    filterBar.style.display = 'flex';
                } else {
                    filterBar.style.display = 'none';
                }
            });
        });

        // ANIMAÇÃO DE ESTRELAS NO CANVAS
        const canvas = document.getElementById('spaceCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const stars = Array.from({ length: 250 }, () => ({
            x: Math.random() * width,
            y: Math.random() * height,
            radius: Math.random() * 1.5,
            alpha: Math.random(),
            speed: Math.random() * 0.02 + 0.005
        }));

        let shootingStars = [];

        function addShootingStar() {
            if (Math.random() < 0.03 && shootingStars.length < 3) {
                shootingStars.push({
                    x: Math.random() * width,
                    y: Math.random() * (height / 2),
                    len: Math.random() * 80 + 50,
                    speed: Math.random() * 10 + 6,
                    size: Math.random() * 1 + 0.1,
                    waitTime: new Date().getTime(),
                    active: true
                });
            }
        }

        function drawSpace() {
            ctx.clearRect(0, 0, width, height);

            // Estrelas piscando
            stars.forEach(star => {
                star.alpha += star.speed;
                if (star.alpha > 1 || star.alpha < 0) star.speed = -star.speed;

                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(star.alpha)})`;
                ctx.fill();
            });

            // Estrelas cadentes
            addShootingStar();
            shootingStars.forEach((s, index) => {
                if (s.active) {
                    ctx.beginPath();
                    const gradient = ctx.createLinearGradient(s.x, s.y, s.x - s.len, s.y + s.len);
                    gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
                    gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
                    ctx.strokeStyle = gradient;
                    ctx.lineWidth = s.size;
                    ctx.moveTo(s.x, s.y);
                    ctx.lineTo(s.x - s.len, s.y + s.len);
                    ctx.stroke();

                    s.x += s.speed;
                    s.y += s.speed;

                    if (s.x > width || s.y > height) {
                        shootingStars.splice(index, 1);
                    }
                }
            });

            requestAnimationFrame(drawSpace);
        }

        // INICIALIZAÇÃO
        renderPlanets();
        buildOrbits();
        setupComparator();
        drawSpace();
    </script>
