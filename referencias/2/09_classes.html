<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./09_classes.css" />
    <style>@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&display=swap');</style> 
    <title>Classes CSS</title>
</head>
<body>
    <div class="menu" >
        <button>Produtos</button>
        <button>Sobre nos</button>
        <button>Contato</button>
    </div>
    
    <div class="cabecalho" >
        <h1 class="texto-animado" >Sorvete Indiano</h1>
        <p class="sub" >Aqui temos os melhores sorvetes feitos pelos nossos pezinhos bem limpinhos</p>
        <p>Uma experiencia que voce vai querer esquecer</p>
    </div>

    <hr class="linha" />

    <h2 class="secao" >Produtos</h2>

    <div class="card" >
        <img src="https://placehold.co/300x300.png" />
        <p class="cardtitulo" >Sorvetes super limpos</p>
        <p class="carddescricao" >Chocolotate pisoteado asfaltado concretado com reboco</p>
        <p class="carddescricao" >R$5,00</p>
        <button class="cardbotao">Comprar</button>
    </div>


</body>
</html>
